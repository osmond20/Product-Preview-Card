<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Product preview card component</title>
  <link rel="stylesheet" href="styles.css">

  <!--Fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
</head>
<body>
    <main>
      <div class="grid_parent">
        <div class="grid-child1">
          <picture>
            <source media="(min-width: 40rem)" srcset="images/image-product-desktop.jpg">
            <source media="(max-width: 40rem)" srcset="images/image-product-mobile.jpg">
            <img src="images/image-product-mobile.jpg" alt="Product advertised">
          </picture>
        </div>
        <div class="grid-child2">
          <p>P E R F U M E</p>
          <h1>Gabrielle Essence Eau De Parfum</h1>
          <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, 
          Perfumer-Creator for the House of CHANEL.</p>
          <section class="prices">
            <h1>$149.99</h1>
            <p>$169.99</p>
          </section>
          <button class="addtocart">
            <img src="images/icon-cart.svg" alt="Icon for adding to cart">
            Add to Cart
          </button>
        </div>
      </div>
    </main>
  

</body>
</html>
